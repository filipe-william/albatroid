<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script type="module">
        import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160/build/three.module.js';
        import { GLTFLoader } from 'https://cdn.jsdelivr.net/npm/three@0.160/examples/jsm/loaders/GLTFLoader.js';
        import { OrbitControls } from 'https://cdn.jsdelivr.net/npm/three@0.160/examples/jsm/controls/OrbitControls.js';
        import gsap from 'https://cdn.jsdelivr.net/npm/gsap@3.12.5/index.js';
        import { ScrollTrigger } from 'https://cdn.jsdelivr.net/npm/gsap@3.12.5/ScrollTrigger.js';
        
        gsap.registerPlugin(ScrollTrigger);
        const canvas = document.querySelector('#webgl');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x111111);

        const camera = new THREE.PerspectiveCamera(
        45,
        window.innerWidth / window.innerHeight,
        0.1,
        100
        );
        camera.position.set(0, 1, 5);

        const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        const light = new THREE.DirectionalLight(0xffffff, 1.5);
        light.position.set(5, 5, 5);
        scene.add(light);
        scene.add(new THREE.AmbientLight(0xffffff, 0.5));

        const controls = new OrbitControls(camera, canvas); /*OrbitControls*/
        controls.enableDamping = true;

        const loader = new GLTFLoader();  /*carregar o modelo*/
        let carcaca, placa, parafusos;

        loader.load('/modelo.glb', (gltf) => {

        const model = gltf.scene;
        scene.add(model);

        carcaca = model.getObjectByName('Carcaca');
        placa = model.getObjectByName('Placa');
        parafusos = model.getObjectByName('Parafusos');
        });
        function animate() {
        controls.update();
        renderer.render(scene, camera);
        requestAnimationFrame(animate);
        }

        animate();

        gsap.timeline({
        scrollTrigger: {
            trigger: document.body,
            start: "top top",
            end: "bottom bottom",
            scrub: true
        }
        })
        .to(carcaca.position, {
        y: -2
        }, 0)
        .to(placa.position, {
        y: 1.5
        }, 0)
        .to(parafusos.position, {
        y: 2
        }, 0);
        window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
        });

        </script>
    <style>
        body {
        margin: 0;
        height: 300vh; /* cria scroll */
        }

        .hero {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100vh;
        }

        canvas {
        display: block;
        }
    </style>
</head>
<body>
    <section class="hero">
      <canvas id="webgl"></canvas>
    </section>
  
    <section class="spacer"></section>
  </body>
</html>
